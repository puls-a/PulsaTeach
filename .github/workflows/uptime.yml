name: Production uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public page
        run: curl --fail --silent --show-error --max-time 20 https://pulsateach.vercel.app/ > /dev/null
      - name: API health
        run: |
          body="$(curl --fail --silent --show-error --max-time 20 https://pulsateach.vercel.app/api/health)"
          echo "$body" | grep -q '"storage":"supabase-strict"'
