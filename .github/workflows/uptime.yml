name: Production uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --retry 2 --retry-all-errors --fail --silent --show-error --max-time 20 https://pulsateach.vercel.app/ > /dev/null
          ready="$(curl --retry 2 --retry-all-errors --fail --silent --show-error --max-time 20 https://pulsateach.vercel.app/api/health/ready)"
          echo "$ready" | grep -q '"ok":true'
          echo "$ready" | grep -q '"storage":"supabase-strict"'
          sitemap="$(curl --retry 2 --retry-all-errors --fail --silent --show-error --max-time 20 https://pulsateach.vercel.app/sitemap.xml)"
          echo "$sitemap" | grep -q '<urlset'
          echo "$sitemap" | grep -q '/learn/html/'
          headers="$(curl --fail --silent --show-error --head --max-time 20 https://pulsateach.vercel.app/)"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^strict-transport-security:'

      - name: Open or update incident
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production monitoring incident";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open"
            });
            const existing = issues.find((issue) => issue.title === title);
            const body = `The scheduled production probe failed at ${new Date().toISOString()}.\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Resolve recovered incident
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production monitoring incident";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open"
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: `Production recovered at ${new Date().toISOString()}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                state: "closed", state_reason: "completed"
              });
            }

      - name: Fail workflow when probe failed
        if: steps.probe.outcome == 'failure'
        run: exit 1
