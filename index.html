<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulsaTeach</title>
    <link rel="canonical" href="https://pulsateach.vercel.app/" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#4F46E5" />

      name="description"
      content="PulsaTeach propose des formations gratuites et interactives pour apprendre HTML, CSS, JavaScript, React, TypeScript, Node.js, SQL, Git, tests, sécurité et performance web."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PulsaTeach" />
    <meta property="og:title" content="PulsaTeach | Interactive coding courses" />
    <meta property="og:description" content="Learn web development through bilingual lessons, quizzes, projects, and verifiable progress." />

    <meta property="og:image:alt" content="Logo PulsaTeach" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PulsaTeach | Interactive coding courses" />
    <meta name="twitter:description" content="Learn web development through bilingual lessons, quizzes, projects, and verifiable progress." />
    <meta name="twitter:image" content="https://pulsateach.vercel.app/assets/logo_horizontale_optimized.webp" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #10172a;
      }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(circle at top left, rgba(85, 70, 246, .10), transparent 28rem),
          linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      }

      #root[data-prerendered] {
        min-height: 100vh;
      }

      #root[data-prerendered] main {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0 0 0 0) !important;
        clip-path: inset(50%) !important;
        white-space: nowrap !important;
      }

      #root[data-prerendered]::before {
        content: "PulsaTeach";
        position: fixed;
        inset-block-start: 24px;
        inset-inline-start: 50%;
        z-index: 2147483647;
        transform: translateX(-50%);
        border: 1px solid rgba(148, 163, 184, .35);
        border-radius: 999px;
        background: rgba(255, 255, 255, .88);
        box-shadow: 0 18px 60px rgba(15, 23, 42, .12);
        color: #5546f6;
        font-size: .92rem;
        font-weight: 900;
        letter-spacing: -.03em;
        padding: .72rem 1rem;
        backdrop-filter: blur(16px);
      }

      #root[data-prerendered]::after {
        content: "";
        position: fixed;
        inset-block-start: 72px;
        inset-inline-start: 50%;
        z-index: 2147483647;
        width: 7.5rem;
        height: .28rem;
        transform: translateX(-50%);
        border-radius: 999px;
        background:
          linear-gradient(90deg, transparent, #5546f6, transparent),
          rgba(85, 70, 246, .12);
        background-size: 50% 100%, 100% 100%;
        background-repeat: no-repeat;
        animation: pulsateach-shell 1s ease-in-out infinite alternate;
      }

      #root[data-prerendered] > main {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      #root[data-prerendered] > main {
        box-sizing: border-box;
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 96px 0 56px;
      }

      #root[data-prerendered] > main h1 {
        max-width: 820px;
        margin: 0 0 16px;
        font-size: clamp(2.4rem, 7vw, 5.8rem);
        line-height: .92;
        letter-spacing: -.06em;
      }

      #root[data-prerendered] > main h2 {
        margin: 44px 0 18px;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
      }

      #root[data-prerendered] > main h3 {
        margin: 0 0 10px;
        font-size: 1.25rem;
      }

      #root[data-prerendered] > main p {
        max-width: 760px;
        font-size: 1.02rem;
        line-height: 1.75;
        color: #475569;
      }

      #root[data-prerendered] > main a {
        color: #5546f6;
        font-weight: 800;
        text-decoration-thickness: .12em;
        text-underline-offset: .18em;
      }

      #root[data-prerendered] > main section:has(article) {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
        align-items: stretch;
      }

      #root[data-prerendered] > main section:has(article) > h2 {
        grid-column: 1 / -1;
      }

      #root[data-prerendered] > main article {
        box-sizing: border-box;
        border: 1px solid rgba(148, 163, 184, .38);
        border-radius: 24px;
        background: rgba(255, 255, 255, .86);
        padding: 22px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, .08);
      }

      #root[data-prerendered] > main ul,
      #root[data-prerendered] > main dl {
        padding-left: 1.15rem;
        color: #475569;
        line-height: 1.65;
      }

      #root[data-prerendered] > main pre {
        overflow: auto;
        border-radius: 18px;
        background: #10172a;
        color: #e0e7ff;
        padding: 18px;
      }

      @media (max-width: 720px) {
        #root[data-prerendered] > main {
          width: min(100% - 20px, 520px);
          padding-top: 48px;
        }
      }

      #root[data-prerendered] > main {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0 0 0 0) !important;
        clip-path: inset(50%) !important;
        white-space: nowrap !important;
      }

      @keyframes pulsateach-shell {
        from { background-position: -60% 0, 0 0; }
        to { background-position: 160% 0, 0 0; }
      }
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PulsaTeach",
        "url": "https://pulsateach.vercel.app/",
        "inLanguage": ["fr", "en"],
        "description": "Bilingual interactive web development learning platform."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
